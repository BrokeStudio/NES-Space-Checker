name: build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: NesSpaceChecker.slnx

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Dist

permissions:
  contents: read

jobs:
  windows:
    strategy:
      matrix:
        platform:
          [
            { arch: "Win32", SDL2libPath: "x86", binPath: "x86" },
            { arch: "x64", SDL2libPath: "x64", binPath: "x86_64" },
          ]
      fail-fast: false
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta8"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Prepare MSVC project files
        run: premake5 --file=Build.lua vs2026

      - name: Build
        run: msbuild NesSpaceChecker.slnx -nologo -t:rebuild -verbosity:normal -clp:ForceConsoleColor -m -property:Configuration=Dist -p:Platform=${{ matrix.platform.arch }}

      - name: Upload NesSpaceChecker
        uses: actions/upload-artifact@v7
        with:
          name: NesSpaceChecker_Windows_${{ matrix.platform.arch }}
          path: Binaries/windows-${{ matrix.platform.binPath }}/Dist/NesSpaceChecker

  linux-ubuntu64:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta2"

      - name: Install dependencies
        run: sudo apt-get install libsdl2-dev libusb-1.0-0-dev

      - name: Generate make file
        run: premake5 --cc=clang --file=Build.lua gmake2

      - name: Build
        run: make config=dist

      - name: Upload NesSpaceChecker
        uses: actions/upload-artifact@v7
        with:
          name: NesSpaceChecker_Linux
          path: Binaries/linux-x86_64/Dist/NesSpaceChecker

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            premake_version: 5.0.0-beta8
            artifact_suffix: AppleSilicon
          - arch: x86_64
            runner: macos-15-intel
            premake_version: 5.0.0-beta2
            artifact_suffix: Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: abel0b/setup-premake@v2.4
        with:
          version: ${{ matrix.premake_version }}

      - name: Make Premake executable
        run: chmod +x "$GITHUB_WORKSPACE/.premake/premake5"

      - name: Download SDL2 framework
        run: |
          SDL_DMG="$RUNNER_TEMP/SDL2-2.32.10.dmg"
          SDL_MOUNT_POINT="$RUNNER_TEMP/SDL2-mount"

          curl -L \
            -o "$SDL_DMG" \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.dmg"

          mkdir -p "$SDL_MOUNT_POINT"

          hdiutil attach "$SDL_DMG" \
            -readonly \
            -nobrowse \
            -mountpoint "$SDL_MOUNT_POINT"

          mkdir -p External/SDL2-macOS

          ditto \
            "$SDL_MOUNT_POINT/SDL2.framework" \
            "External/SDL2-macOS/SDL2.framework"

          hdiutil detach "$SDL_MOUNT_POINT"

      - name: Prepare make file
        run: premake5 --arch=${{ matrix.arch }} --file=Build.lua gmake2

      - name: Build
        run: make config=dist verbose=1

      - name: Locate macOS app
        run: |
          APP_PATH="$(find Binaries -type d -name NesSpaceChecker.app -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "NesSpaceChecker.app was not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Sign macOS app
        run: |
          codesign --force --sign - \
            "$APP_PATH/Contents/Frameworks/SDL2.framework"

          codesign --force --sign - \
            "$APP_PATH"

      - name: Verify macOS app
        run: |
          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/NesSpaceChecker"

          plutil -lint "$APP_PATH/Contents/Info.plist"
          test -x "$EXECUTABLE_PATH"
          file "$EXECUTABLE_PATH"
          lipo "$EXECUTABLE_PATH" -verify_arch ${{ matrix.arch }}
          lipo \
            "$APP_PATH/Contents/Frameworks/SDL2.framework/Versions/A/SDL2" \
            -verify_arch ${{ matrix.arch }}
          vtool -show-build "$EXECUTABLE_PATH"
          vtool -show-build \
            "$APP_PATH/Contents/Frameworks/SDL2.framework/Versions/A/SDL2"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Package macOS app
        run: |
          tar -czf \
            "$RUNNER_TEMP/NesSpaceChecker-${{ matrix.artifact_suffix }}.tar.gz" \
            -C "$(dirname "$APP_PATH")" \
            "$(basename "$APP_PATH")"

      - name: Upload NesSpaceChecker app
        uses: actions/upload-artifact@v7
        with:
          name: NesSpaceChecker_macOS_${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/NesSpaceChecker-${{ matrix.artifact_suffix }}.tar.gz
          archive: false
